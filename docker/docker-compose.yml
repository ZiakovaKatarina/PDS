# version: '3.8'

# https://hub.docker.com/r/gvenzl/oracle-free

services:
  oracle:
    container_name: "oracle"
    #image: "container-registry.oracle.com/database/free:latest"
    image: "gvenzl/oracle-free:latest"  # version 21 is not supported
    restart: "unless-stopped"
    ports: 
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}  # specifies the password for the Oracle Database SYS and SYSTEM users.
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata # volume managed by docker `docker volume inspect oracle-data` to inspect locations
      # - ./oracle-data:/opt/oracle/oradata # mounted from system filesystem
      - ./init:/container-entrypoint-initdb.d:ro
      - ../sql/init:/db_init_sql:ro
      #- ./init:/container-entrypoint-initdb.d

volumes:
  oracle-data:
